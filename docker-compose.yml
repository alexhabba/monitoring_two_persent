services:
  bot:
    build: .
    container_name: monitoring_two_persent
    restart: unless-stopped
    init: true
    env_file: .env          # ключи и настройки; DRY_RUN=false включает боевой режим
    environment:            # приоритетнее env_file: состояние и логи всегда в смонтированном томе
      DATA_DIR: /data
      LOG_DIR: /data/logs
      # --- быстрое закрытие: WebSocket, пачка тейк-профитов, закрытие пачкой (цель дня задаётся в .env) ---
      USE_WEBSOCKET: "true"      # стакан/позиции/исполнения по WebSocket (при сбое — REST)
      TP_LADDER: "true"          # заранее выставленные тейк-профиты (пачка)
      TP_LADDER_FOLLOWERS: "true" # и на копирующих счетах (каждая со своей целью)
      CLOSE_PACK: "true"         # после цели закрываем всю позицию пачкой лимиток, а не по куску за секунду
      TP_GOAL_COEF: "1.3"         # пачка лимиток на уровне результата дня = 1.3 × цель дня
      UI_HOST: 0.0.0.0      # внутри контейнера; наружу порт открыт только на localhost сервера (см. ports)
    ports:
      - "127.0.0.1:8080:8080"   # веб-интерфейс настроек: только через SSH-туннель
    volumes:
      - ./data:/data        # SQLite-состояние и логи (переживают пересоздание контейнера)
    stop_grace_period: 20s
    logging:                # ротация stdout-лога Docker: максимум 3 x 10 МБ
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
